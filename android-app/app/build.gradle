plugins {
    id 'com.android.application'
}

android {
    compileSdkVersion 36
    namespace "com.incuspaze.assetregister"
    defaultConfig {
        applicationId "com.incuspaze.assetregister"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 1
        versionName "1"

        resValue "string", "appName", "IncuAsset — Asset Register"
        resValue "string", "launcherName", "IncuAsset"
    }
    signingConfigs {
        release {
            // Keep the keystore OUTSIDE this repo. Put these in a local
            // "keystore.properties" file (gitignored) or as Gradle properties
            // in your global ~/.gradle/gradle.properties, e.g.:
            //   RELEASE_STORE_FILE=/absolute/path/to/android.keystore
            //   RELEASE_STORE_PASSWORD=...
            //   RELEASE_KEY_ALIAS=incuasset
            //   RELEASE_KEY_PASSWORD=...
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        checkReleaseBuilds false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
